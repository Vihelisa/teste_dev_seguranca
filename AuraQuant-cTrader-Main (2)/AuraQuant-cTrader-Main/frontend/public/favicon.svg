<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <!-- Chart bars representing trading -->
  <rect x="10" y="38" width="8" height="16" rx="2" fill="#00e5ff" opacity="0.6"/>
  <rect x="22" y="28" width="8" height="26" rx="2" fill="#00e5ff" opacity="0.8"/>
  <rect x="34" y="18" width="8" height="36" rx="2" fill="#00e5ff"/>
  <rect x="46" y="24" width="8" height="30" rx="2" fill="#a855f7" opacity="0.9"/>
  <!-- Trend line -->
  <polyline points="14,36 26,26 38,16 50,22" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at peak -->
  <circle cx="38" cy="16" r="3" fill="#ffffff"/>
</svg>
